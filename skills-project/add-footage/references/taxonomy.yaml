# Từ điển phân loại kho footage DiLiM. Agent dùng id ở đây cho --topic/--kind/--product.
# Sửa file này khi thêm thư mục/sản phẩm mới; build_index.py đọc lại mỗi lần chạy.

topics:
  xuong_khop:          {vi: "Xương khớp - đau khớp, thoái hóa, sụn"}
  mach_mau_than_kinh:  {vi: "Mạch máu - thần kinh - tế bào, xơ vữa, hồng cầu, synapse"}
  dot_quy:             {vi: "Đột quỵ, tai biến, cấp cứu"}
  dau_dau_chong_mat:   {vi: "Đau đầu - chóng mặt - mệt mỏi - ốm"}
  ngu:                 {vi: "Giấc ngủ: mất ngủ, trằn trọc, ngủ ngon"}
  giam_can:            {vi: "Giảm cân, béo, mỡ bụng, ăn kiêng"}
