  do_an:               {vi: "Đồ ăn nói chung, nấu, ăn, dầu mỡ, đồ chiên"}
  bia_ruou:            {vi: "Bia rượu, nhậu, say"}
  the_thao:            {vi: "Thể dục thể thao, chạy bộ, tập gym, người lớn tuổi vận động"}
  thien_doc_sach:      {vi: "Thiền, yoga, đọc sách, thư giãn"}
  van_phong:           {vi: "Nhân viên văn phòng, stress, làm việc, mệt mỏi công việc"}
  dien_thoai_mxh:      {vi: "Nghiện điện thoại, mạng xã hội, cúi đầu xem màn hình"}
  gia_dinh:            {vi: "Gia đình: vui vẻ, cãi vã, con cái, cha mẹ"}
  vo_chong:            {vi: "Vợ chồng, phòng ngủ, sinh lý, tình cảm"}
  toc_da_lam_dep:      {vi: "Tóc, da, làm đẹp, lão hóa"}
  ai_cong_nghe:        {vi: "AI, công nghệ, dữ liệu, màn hình"}
  san_pham:            {vi: "Sản phẩm DiLiM thật (hộp, viên, nguyên liệu)"}
  dilim_quay:          {vi: "Footage DiLiM tự quay: bác sĩ, người thật cầm sản phẩm"}
  thuong_hieu:         {vi: "Ảnh thương hiệu, công bố, nhà máy"}
  cta:                 {vi: "Đoạn kết / kêu gọi để lại tên SĐT"}
  an_du:               {vi: "Ẩn dụ vật thể: rỉ sét, động cơ, ống tắc, sàng gạo..."}

# Thư mục gốc trong broll_root -> topic + pool (thứ tự ưu tiên tìm)
# pool: chuan_hoa(0) > topic(1) = product(1, chỉ khi nhắc sản phẩm) > dilim_quay(2) > cta(3) > lon_xon(5)
folders:
  "Đã Chuẩn Hóa":                               {pool: chuan_hoa, topics: []}
  "Product Broll":                              {pool: product, topics: [san_pham]}
  "Footage Dilim Quay":                         {pool: dilim_quay, topics: [dilim_quay, kham_benh]}
  "Dilim":                                      {pool: dilim_quay, topics: [thuong_hieu]}
  "CTA":                                        {pool: cta, topics: [cta]}
  "Lộn Xộn Xà bần":                             {pool: lon_xon, topics: []}
  "Xương khớp - Đau":                           {pool: topic, topics: [xuong_khop]}
  "Mạch Máu - Thần Kinh - TẾ BÀO":              {pool: topic, topics: [mach_mau_than_kinh]}
  "Đột quỵ":                                    {pool: topic, topics: [dot_quy, mach_mau_than_kinh]}
  "Đau đầu - Chóng mặt - Mệt mõi - Bệnh":       {pool: topic, topics: [dau_dau_chong_mat]}
  "Ngủ- Ngon- mất ngủ":                         {pool: topic, topics: [ngu]}
  "Giảm cân - Mập, tăng cân":                   {pool: topic, topics: [giam_can]}
  "NỘI TẠNG":                                   {pool: topic, topics: [noi_tang]}
  "Đau Bụng - Tiêu hóa":                        {pool: topic, topics: [tieu_hoa]}
  "Ho - Khó Thở":                               {pool: topic, topics: [ho_kho_tho]}
  "Khám bệnh - Bác Sĩ - uống Thuốc- bệnh khác": {pool: topic, topics: [kham_benh]}
  "Ăn uống lành mạnh":                          {pool: topic, topics: [an_uong_lanh_manh]}
  "Đồ ăn - Ăn uống":                            {pool: topic, topics: [do_an]}
  "Bia Rượu - Nhậu":                            {pool: topic, topics: [bia_ruou]}
  "Thể dục thể thao":                           {pool: topic, topics: [the_thao]}
  "Thiền - Đọc sách":                           {pool: topic, topics: [thien_doc_sach]}
  "Nhân Viên văn phòng":                        {pool: topic, topics: [van_phong]}
  "Nghiện Điện Thoại MXH":                      {pool: topic, topics: [dien_thoai_mxh]}
  "Gia đình - Vui vẻ- Cãi vã":                  {pool: topic, topics: [gia_dinh]}
  "Hàu- Vợ chồng":                              {pool: topic, topics: [vo_chong]}
  "TÓC- DA- LÀM ĐẸP":                           {pool: topic, topics: [toc_da_lam_dep]}
  "AI":                                         {pool: topic, topics: [ai_cong_nghe]}

