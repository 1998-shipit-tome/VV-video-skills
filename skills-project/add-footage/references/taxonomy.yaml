# Loại hình chủ thể (subject_type) — quyết định "người thật hay đồ họa"
subject_types:
  real_person:     "người thật quay thật (kể cả AI-gen chân thực)"
  anatomy_3d:      "đồ họa 3D/animation giải phẫu: khớp, mạch máu, tế bào, não, nội tạng"
  product:         "hộp/viên/nhãn sản phẩm, nguyên liệu, nhà máy, chứng nhận"
  metaphor_object: "vật thể ẩn dụ: máy rỉ sét, ống tắc, sàng gạo, dầu nhớt, đồng hồ cát"
  lifestyle_scene: "cảnh sinh hoạt không nhân vật rõ: bữa ăn bày sẵn, đường phố, thiên nhiên"
  text_graphic:    "chữ/biểu đồ/infographic đã burn sẵn"
  screen_ui:       "màn hình điện thoại/máy tính, giao diện app"

moods: [positive, negative, neutral, painful, tense]

